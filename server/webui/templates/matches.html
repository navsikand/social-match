{% extends "base.html" %}
{% block title %}Matches — Social Match{% endblock %}
{% block content %}
<section class="hero">
  <h1>Confirmed matches</h1>
  <p class="muted">Plans both sides confirmed. Withdrawing is always one tap away on the card.</p>
</section>

<section class="panel">
  <p id="matches-status" class="notice info">Loading matches…</p>
  <div id="matches-list" class="cards"></div>
</section>
{% endblock %}
{% block scripts %}
<script>
  const status = document.getElementById("matches-status");
  const list = document.getElementById("matches-list");

  function matchEl(item) {
    const el = document.createElement("article");
    el.className = "card candidate";

    const h = document.createElement("h3");
    h.textContent = item.about || ("Match " + (item.candidate_id || ""));
    el.appendChild(h);

    const when = document.createElement("p");
    when.className = "muted";
    when.textContent =
      (item.window && (item.window.display_with_date || item.window.display)) || "Window confirmed";
    el.appendChild(when);

    const badge = document.createElement("p");
    badge.className = "muted";
    badge.textContent = item.historical ? "Past plan" : (item.state === "closed" ? "Closed" : "Upcoming");
    el.appendChild(badge);

    if (item.card_url) {
      const a = document.createElement("a");
      a.className = "button";
      a.href = item.card_url;
      a.textContent = "Open card";
      el.appendChild(a);
    }
    return el;
  }

  (async function () {
    try {
      const res = await fetch("/api/matches", {headers: {"Accept": "application/json"}});
      if (res.status === 401) {
        window.location.href = "/login?next=/matches";
        return;
      }
      if (!res.ok) {
        let data = null;
        try { data = await res.json(); } catch (err) { data = null; }
        show(status, "Couldn't load your matches. " + apiError(res, data), "error");
        return;
      }
      const data = await res.json();
      const items = (data && data.matches) || [];
      list.innerHTML = "";
      for (const item of items) list.appendChild(matchEl(item));
      if (items.length === 0) show(status, "No confirmed plans yet.", "info");
      else status.hidden = true;
    } catch (err) {
      show(status, "Couldn't load your matches. Check your connection and try again.", "error");
    }
  })();
</script>
{% endblock %}
