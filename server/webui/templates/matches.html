{% extends "base.html" %}
{% block title %}Matches — Social Match{% endblock %}
{% block content %}
<section class="hero">
  <h1>Confirmed matches</h1>
  <p class="muted">Plans both sides confirmed. Withdrawing is always one tap away on the card.</p>
</section>

<section class="panel">
  <p id="matches-status" class="notice info">Loading matches…</p>
  <div id="matches-list" class="cards"></div>
</section>
{% endblock %}
{% block scripts %}
<script>
  const status = document.getElementById("matches-status");
  const list = document.getElementById("matches-list");
  const EXPIRED_NOTICE =
    "Your saved free time expired — re-add it to see your plans.";

  function matchEl(item) {
    const el = document.createElement("article");
    el.className = "card candidate";

    const h = document.createElement("h3");
    h.textContent = item.about || ("Match " + (item.candidate_id || ""));
    el.appendChild(h);

    const when = document.createElement("p");
    when.className = "muted";
    when.textContent =
      (item.window && (item.window.display_with_date || item.window.display)) || "Window confirmed";
    el.appendChild(when);

    const badge = document.createElement("p");
    badge.className = "muted";
    badge.textContent = item.historical ? "Past plan" : (item.state === "closed" ? "Closed" : "Upcoming");
    el.appendChild(badge);

    if (item.card_url) {
      const a = document.createElement("a");
      a.className = "button";
      a.href = item.card_url;
      a.textContent = "Open card";
      el.appendChild(a);
    }
    return el;
  }

  let lastPayload = null;
  let pollSeq = 0;
  let pollInFlight = false;

  async function load() {
    const seq = ++pollSeq;
    let res;
    try {
      res = await fetch("/api/matches", {headers: {"Accept": "application/json"}});
    } catch (err) {
      show(status, "Couldn't load your matches. Check your connection and try again.", "error");
      return;
    }
    // REGRESSION-4: drop a stale response that a newer request already superseded.
    if (seq !== pollSeq) return;
    if (res.status === 401) {
      window.location.href = "/login?next=/matches";
      return;
    }
    let data = null;
    try { data = await res.json(); } catch (err) { data = null; }
    if (seq !== pollSeq) return;
    if (!res.ok) {
      show(status, "Couldn't load your matches. " + apiError(res, data), "error");
      return;
    }
    const key = JSON.stringify(data);
    // B1: re-render only when the payload changed, so polling never reflows the page.
    if (key === lastPayload) return;
    lastPayload = key;
    const items = (data && data.matches) || [];
    list.innerHTML = "";
    for (const item of items) list.appendChild(matchEl(item));
    if (items.length === 0) {
      show(status, "No confirmed plans yet.", "info");
    } else {
      status.hidden = true;
    }
    if (data && data.availability_lapsed) {
      // B4: anonymous by design — it never names the person or the withheld window.
      const notice = document.createElement("p");
      notice.className = "notice warn";
      notice.textContent = EXPIRED_NOTICE;
      list.appendChild(notice);
    }
  }

  load();

  // REGRESSION-4: shared poll pattern — skip hidden tabs, never overlap, drop stale responses.
  async function poll() {
    if (document.hidden || pollInFlight) return;
    pollInFlight = true;
    try {
      await load();
    } finally {
      pollInFlight = false;
    }
  }

  window.setInterval(poll, 15000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) poll();
  });
</script>
{% endblock %}
