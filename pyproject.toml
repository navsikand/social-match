[project]
name = "social-match"
version = "0.1.0"
description = "Track 2 hackathon build: agent-to-agent social matching (server + web + chat assistant)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "pillow>=13.0.0",
]

[project.optional-dependencies]
# The learned interest encoder (server/encoder.py). Without it the server falls back to the
# hand-made taxonomy. Install with: uv sync --extra encoder
#
# CPU-ONLY, deliberately. The model is bge-small (33M params) and we embed 34 tags once at
# startup, so a GPU saves milliseconds while pulling ~2.5 GB of CUDA wheels. The torch source
# below pins the CPU build on every machine, so `auto` can never silently drag in CUDA.
encoder = ["sentence-transformers>=3.0", "torch>=2.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
