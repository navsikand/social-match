[project]
name = "social-match"
version = "0.1.0"
description = "Track 2 hackathon build: agent-to-agent social matching (server + Cubbie skill + web)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
  "itsdangerous>=2.2",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
